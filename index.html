<body>
  <header class="topbar">
    <a class="brand" href="dashboard/" rel="noopener noreferrer" aria-label="LooksRare home">
      <img src="favicon.png" width="28" height="28" alt="">
      <span>LooksRare</span>
    </a>
    <nav class="nav" aria-label="Authority references">

      <div class="nft-tile" aria-hidden="true">
        <div class="tile-grid"></div>
        <img class="tile-badge" src="looks.png" width="34" height="34" alt="">
      </div>
      <div class="listing-row">
        <span class="listing-label">List or buy NFTs</span>
        <button class="mode-toggle" type="button" data-mode-toggle aria-label="Switch buy or sell mode">Buy</button>
        <span class="eth-chip">
          <img src="eth.png" width="22" height="22" alt="">
          <span>ETH</span>
        </span>
      </div>
      <a class="primary" href="dashboard/" rel="noopener noreferrer">Enter App</a>
    </section>
  </main>

  <footer class="foot">LooksRare &mdash; 2026</footer>

  <script>
  (function () {
    "use strict";
    var button = document.querySelector("[data-mode-toggle]");
    if (!button) return;
    button.addEventListener("click", function () {
      var next = button.textContent === "Buy" ? "Sell" : "Buy";
      button.textContent = next;
    });
  }());
  </script>
